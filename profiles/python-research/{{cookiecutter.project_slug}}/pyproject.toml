[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "A reproducible Python research project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.package_name }}"]

[dependency-groups]
dev = [
    "import-linter>=2.5,<3",
    "jscpd==5.4.3",
    "mypy>=1.15,<3",
    "pytest>=8,<10",
    "radon==6.0.1",
    "ruff>=0.11,<1",
]

[tool.uv]
required-version = ">=0.9.22"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/fast"]
addopts = "--strict-config --strict-markers"

[tool.importlinter]
root_package = "{{ cookiecutter.package_name }}"

[[tool.importlinter.contracts]]
name = "Pipeline may depend on analysis"
type = "layers"
containers = ["{{ cookiecutter.package_name }}"]
layers = ["pipeline", "analysis"]
exhaustive = true
