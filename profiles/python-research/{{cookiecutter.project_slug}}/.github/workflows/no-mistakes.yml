name: No-mistakes attestation

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  attestation:
    name: Require no-mistakes
    runs-on: ubuntu-latest
    steps:
      # This action uses live PR metadata and never checks out contributor code.
      - uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@4822244e763fd4c3d7f48be6433f92df10bb5b33 # v1.84.0
